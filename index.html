<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XYRO Robot Face</title>

<style>
:root {
  --blue-glow: #00d0ff;
  --blue-bright: #6be4ff;
  --blue-deep: #0077ff;
  --amber: #ffbd27;
  --bright: #ffe66a;
  --dark-mouth: #070e17;
}

* { 
  box-sizing: border-box; 
  margin: 0;
  padding: 0;
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000000;
  font-family: Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Tablet responsive stage */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4vmin;
}

svg {
  width: 100%;
  height: 100%;
  max-width: 95vw;
  max-height: 90vh;
  overflow: visible;
  filter: drop-shadow(0 0 30px rgba(0, 180, 255, 0.35));
}

/* Organic head breathing bob */
.face-features {
  transform-origin: 400px 360px;
  animation: floatFace 4.8s ease-in-out infinite;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes floatFace {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.detected .face-features {
  animation: excitedBounce 1.6s ease-in-out infinite alternate;
}

@keyframes excitedBounce {
  0% { transform: translateY(-5px) scale(1.02); }
  100% { transform: translateY(-16px) scale(1.04); }
}

/* ========================================================
   CYBERPUNK SLEEK EYEBROWS
   ======================================================== */
.brow-group {
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

#browLeftGroup {
  transform-origin: 290px 235px;
}

#browRightGroup {
  transform-origin: 510px 235px;
}

.brow-main {
  fill: var(--blue-bright);
  filter: url(#glowBlue);
}

.brow-accent {
  fill: #e0f9ff;
}

/* Joyful raised arches when smiling */
.detected #browLeftGroup {
  transform: translateY(-18px) rotate(-8deg);
}

.detected #browRightGroup {
  transform: translateY(-18px) rotate(8deg);
}

/* ========================================================
   ELECTRIC BLUE EYES
   ======================================================== */
.eye-glow {
  fill: var(--blue-glow);
  opacity: 0.45;
  filter: url(#blur);
}

.eye {
  fill: url(#blueEyeGradient);
  stroke: #bbf3ff;
  stroke-width: 3;
  filter: url(#glowBlue);
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.3s ease;
}

.eye-ring {
  fill: none;
  stroke: #0099ff;
  stroke-width: 2.5;
  opacity: 0.6;
  transform-box: fill-box;
  transform-origin: center;
}

.eye-shine {
  fill: none;
  stroke: #ffffff;
  stroke-width: 6;
  stroke-linecap: round;
}

.eye-star {
  fill: #ffffff;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(0) rotate(0deg);
  transition: opacity .35s ease, transform .45s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: url(#glowBlue);
}

.detected .eye-star {
  opacity: 1;
  transform: scale(1.15) rotate(45deg);
}

/* Blinking */
.blink .eye,
.blink .eye-ring,
.blink .eye-shine,
.blink .eye-star {
  transform: scaleY(.04) !important;
}

/* ========================================================
   NEUTRAL CLOSED LIPS (RESTING STATE)
   ======================================================== */
.closed-mouth-group {
  opacity: 1;
  transform-origin: 400px 465px;
  transform: scale(1);
  transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.detected .closed-mouth-group {
  opacity: 0;
  transform: scale(0.65);
  pointer-events: none;
}

.lip-socket {
  fill: #060d16;
  stroke: #16263b;
  stroke-width: 3;
}

.lip-seam {
  fill: none;
  stroke: var(--blue-bright);
  stroke-width: 8;
  stroke-linecap: round;
  filter: url(#glowBlue);
}

.lip-accent {
  fill: var(--blue-glow);
  filter: url(#glowBlue);
}

/* ========================================================
   OPEN MOUTH SMILE (FACE DETECTED)
   ======================================================== */
.open-mouth-group {
  opacity: 0;
  transform-origin: 400px 465px;
  transform: scale(0.6) translateY(-10px);
  transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}

.detected .open-mouth-group {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.mouth-cavity {
  fill: var(--dark-mouth);
  stroke: var(--blue-bright);
  stroke-width: 7;
  filter: url(#glowBlue);
}

.mouth-teeth {
  fill: #ffffff;
  opacity: 0.95;
}

#cameraVideo {
  display: none;
}
</style>
</head>

<body>

<main class="stage">
<svg id="robot" viewBox="150 180 500 370" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Robot Eyes and Mouth">

<defs>
  <!-- Electric Blue Radial/Linear Gradient -->
  <linearGradient id="blueEyeGradient" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b8f4ff"/>
    <stop offset=".25" stop-color="#38d4ff"/>
    <stop offset=".75" stop-color="#0080ff"/>
    <stop offset="1" stop-color="#0044aa"/>
  </linearGradient>

  <!-- Blue Glow Filter -->
  <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="blurred"/>
    <feMerge>
      <feMergeNode in="blurred"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

  <clipPath id="mouthClip">
    <path d="M 325,434 C 325,434 400,444 475,434 C 483,434 490,444 482,468 C 466,512 430,534 400,534 C 370,534 334,512 318,468 C 310,444 317,434 325,434 Z"/>
  </clipPath>
</defs>

<g class="face-features">
  <!-- Left Eyebrow -->
  <g id="browLeftGroup" class="brow-group">
    <rect class="brow-main" x="250" y="234" width="80" height="9" rx="4.5"/>
    <rect class="brow-accent" x="250" y="234" width="22" height="9" rx="4.5"/>
  </g>

  <!-- Right Eyebrow -->
  <g id="browRightGroup" class="brow-group">
    <rect class="brow-main" x="470" y="234" width="80" height="9" rx="4.5"/>
    <rect class="brow-accent" x="528" y="234" width="22" height="9" rx="4.5"/>
  </g>

  <!-- Eyes Group -->
  <g id="eyes">
    <ellipse class="eye-glow" cx="290" cy="330" rx="58" ry="68"/>
    <ellipse class="eye-glow" cx="510" cy="330" rx="58" ry="68"/>

    <!-- Left Eye -->
    <g>
      <ellipse class="eye" cx="290" cy="330" rx="42" ry="55"/>
      <ellipse class="eye-ring" cx="290" cy="330" rx="34" ry="46"/>
      <path class="eye-star" d="M290 316 Q290 326 280 326 Q290 326 290 336 Q290 326 300 326 Q290 326 290 316 Z" />
      <path class="eye-shine" d="M254 337 Q290 304 326 337"/>
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse class="eye" cx="510" cy="330" rx="42" ry="55"/>
      <ellipse class="eye-ring" cx="510" cy="330" rx="34" ry="46"/>
      <path class="eye-star" d="M510 316 Q510 326 500 326 Q510 326 510 336 Q510 326 520 326 Q510 326 510 316 Z" />
      <path class="eye-shine" d="M474 337 Q510 304 546 337"/>
    </g>
  </g>

  <!-- Closed Resting Lips -->
  <g id="closedMouth" class="closed-mouth-group">
    <path class="lip-socket" d="M330 460 Q400 453 470 460 Q400 475 330 460 Z"/>
    <path class="lip-seam" d="M338 462 Q400 460 462 462"/>
    <circle class="lip-accent" cx="336" cy="462" r="4"/>
    <circle class="lip-accent" cx="464" cy="462" r="4"/>
  </g>

  <!-- Open Smile -->
  <g id="openMouth" class="open-mouth-group">
    <path class="mouth-cavity" d="M 325,434 C 325,434 400,444 475,434 C 483,434 490,444 482,468 C 466,512 430,534 400,534 C 370,534 334,512 318,468 C 310,444 317,434 325,434 Z"/>
    <g clip-path="url(#mouthClip)">
      <rect class="mouth-teeth" x="340" y="432" width="120" height="16" rx="5"/>
    </g>
  </g>
</g>
</svg>
</main>

<video id="cameraVideo" autoplay muted playsinline></video>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const robot = document.getElementById("robot");
const video = document.getElementById("cameraVideo");

let detector = null;
let animationFrame = null;
let isSmiling = false;

function setSmileState(detected) {
  if (detected === isSmiling) return;
  isSmiling = detected;
  robot.classList.toggle("detected", isSmiling);
}

function scheduleBlink() {
  const nextInterval = 2200 + Math.random() * 3000;
  setTimeout(() => {
    robot.classList.add("blink");
    setTimeout(() => {
      robot.classList.remove("blink");
      scheduleBlink();
    }, 150);
  }, nextInterval);
}

function processVideo() {
  if (!video.srcObject || !detector) return;

  if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
    try {
      const detectionResult = detector.detectForVideo(video, performance.now());
      const hasFace = Boolean(detectionResult.detections && detectionResult.detections.length > 0);
      setSmileState(hasFace);
    } catch (_) {}
  }

  animationFrame = requestAnimationFrame(processVideo);
}

async function initVisionAndCamera() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      console.warn("Camera API requires HTTPS or a localhost server.");
      return;
    }

    const visionFiles = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    detector = await FaceDetector.createFromOptions(visionFiles, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      minDetectionConfidence: 0.5
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    video.srcObject = stream;
    await video.play();

    processVideo();
  } catch (err) {
    console.warn("Camera initialization error:", err.message || err);
  }
}

async function enableWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      await navigator.wakeLock.request("screen");
    }
  } catch (_) {}
}

window.addEventListener("DOMContentLoaded", () => {
  initVisionAndCamera();
  scheduleBlink();
  enableWakeLock();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    enableWakeLock();
  }
});

window.addEventListener("pagehide", () => {
  if (animationFrame) cancelAnimationFrame(animationFrame);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
});
</script>
</body>
</html>
